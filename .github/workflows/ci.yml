name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  linux:
    name: Linux build, tests and headless demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build (warnings are errors)
        run: dotnet build AetherWorkspace.slnx -c Release
      - name: Validate Windows reference-test orchestrator script
        shell: pwsh
        run: |
          $path = 'tools/windows-test/Run-AetherTests.ps1'
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            throw "PowerShell parse errors:`n$($errors | Out-String)"
          }
          $defs = @($ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true) | ForEach-Object { $_.Name })
          $required = @(
            'Read-TrxCounters', 'Read-TrxCountersAggregate', 'Get-SolutionTestProjects',
            'Invoke-SolutionTestSuite', 'Invoke-TestSuites', 'Get-ProfileSuites',
            'Write-RunResult', 'Complete-Cleanup', 'Invoke-Preflight'
          )
          $missing = @($required | Where-Object { $defs -notcontains $_ })
          if ($missing.Count -gt 0) {
            throw "Orchestrator is missing required helper definitions: $($missing -join ', ')"
          }
          Write-Host "Orchestrator script OK ($($defs.Count) functions, $($required.Count) required helpers present)."
      - name: Run full test suite
        run: dotnet test AetherWorkspace.slnx -c Release --no-build --logger "trx;LogFileName=linux-tests.trx"
      - name: FDC3 official-schema interop check (independent Python validator)
        run: |
          python3 -m pip install --quiet 'jsonschema==4.23.0'
          python3 tools/fdc3-interop/validate_fdc3.py --report .aether/fdc3-interop-report.json
      - name: FDC3 DACP runtime interop with Sail headless agent
        run: |
          npm --prefix tools/fdc3-interop ci --no-audit --no-fund
          npm --prefix tools/fdc3-interop run interop -- --report "$PWD/.aether/dacp-interop-report.json"
      - name: Headless reference workflow demo (Unix domain sockets)
        run: SKIP_BUILD=1 ./scripts/demo.sh
      - name: OS-level blocked-egress check (isolated network namespace)
        run: ./scripts/egress-blocked-check.sh
      - name: IPC benchmark smoke
        run: dotnet run -c Release --no-build --project benchmarks/Aether.IpcBench -- --samples 200 --warmup 50
      - name: Publish framework-dependent apps and generate SBOM
        run: |
          dotnet publish src/Aether.BrokerApp -c Release -o artifacts/publish/broker -v q
          dotnet publish src/Aether.Shell.Headless -c Release -o artifacts/publish/shell -v q
          dotnet publish src/Aether.SampleApps.Headless -c Release -o artifacts/publish/samples -v q
          mkdir -p artifacts/sbom
          mkdir -p artifacts/sbom
          dotnet tool install --tool-path .tools/sbom Microsoft.Sbom.DotNetTool --version 4.1.13
          DOTNET_ROLL_FORWARD=Major .tools/sbom/sbom-tool generate \
            -b artifacts/publish -bc . -pn AetherWorkspace -pv 0.3.0 -ps "AetherWorkspace contributors" -m artifacts/sbom
          find artifacts/sbom -name '*.json' -exec cp {} artifacts/ \; || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-evidence
          path: |
            .aether/
            TestResults/
            BenchmarkDotNet.Artifacts/
            artifacts/
          if-no-files-found: warn

  windows:
    name: Windows build, tests and named-pipe demo
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build (includes WPF projects)
        run: dotnet build AetherWorkspace.slnx -c Release
      - name: Run full test suite
        run: dotnet test AetherWorkspace.slnx -c Release --no-build --logger "trx;LogFileName=windows-tests.trx"
      - name: Windows named-pipe IPC benchmark
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .aether -Force | Out-Null
          dotnet run -c Release --no-build --project benchmarks/Aether.IpcBench -- --samples 300 --warmup 50 |
            Tee-Object -FilePath .aether/windows-ipc-benchmark.txt
      - name: Headless reference workflow demo (Windows named pipes)
        run: pwsh -NoProfile ./scripts/demo.ps1
        env:
          SKIP_BUILD: '1'
      - name: OS-level blocked-egress check (Windows Firewall outbound block)
        run: pwsh -NoProfile ./scripts/egress-blocked-check.ps1
        env:
          SKIP_BUILD: '1'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence
          path: |
            .aether/
            TestResults/
          if-no-files-found: warn

  windows-ui:
    name: Windows WPF UI automation (FlaUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Ensure Microsoft Edge WebView2 Runtime
        shell: pwsh
        run: |
          $roots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'),
            (Join-Path $env:ProgramFiles 'Microsoft\EdgeWebView\Application')
          )
          if (@($roots | Where-Object { Test-Path -LiteralPath $_ -PathType Container }).Count -eq 0) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124701' -OutFile $installer -UseBasicParsing
            Start-Process -FilePath $installer -ArgumentList @('/silent', '/install') -Wait
            if (@($roots | Where-Object { Test-Path -LiteralPath $_ -PathType Container }).Count -eq 0) {
              throw 'WebView2 Runtime installation did not create an EdgeWebView\Application directory.'
            }
          }
          Write-Host 'Microsoft Edge WebView2 Runtime is available for the UI lane.'

      - name: Build solution and Windows UI test projects
        run: |
          if (-not (Test-Path 'tests/Aether.Shell.UiTests/Aether.Shell.UiTests.csproj')) {
            throw 'Required UI test project tests/Aether.Shell.UiTests is missing; the windows-ui lane must fail rather than silently skip.'
          }
          if (-not (Test-Path 'tests/Aether.Desktop.E2E.Tests/Aether.Desktop.E2E.Tests.csproj')) {
            throw 'Required reference-desktop E2E project tests/Aether.Desktop.E2E.Tests is missing; the windows-ui lane must fail rather than silently skip.'
          }
          dotnet build AetherWorkspace.slnx -c Release
          dotnet build tests/Aether.Shell.UiTests/Aether.Shell.UiTests.csproj -c Release
          dotnet build tests/Aether.Desktop.E2E.Tests/Aether.Desktop.E2E.Tests.csproj -c Release
      - name: Run WPF shell UI automation tests
        run: dotnet test tests/Aether.Shell.UiTests/Aether.Shell.UiTests.csproj -c Release --no-build --logger "trx;LogFileName=windows-ui-tests.trx"
      - name: Run reference-desktop Named-Pipes GUI E2E tests
        run: dotnet test tests/Aether.Desktop.E2E.Tests/Aether.Desktop.E2E.Tests.csproj -c Release --no-build --filter "Category=ReferenceDesktop|Category=Privacy04|Category=Layout05" --logger "trx;LogFileName=windows-desktop-e2e.trx"
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-evidence
          path: |
            .aether/
            tests/Aether.Shell.UiTests/TestResults/
            tests/Aether.Desktop.E2E.Tests/TestResults/
          if-no-files-found: warn
