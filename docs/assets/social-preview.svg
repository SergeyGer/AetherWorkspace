<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131F"/>
      <stop offset="0.55" stop-color="#0A1D2E"/>
      <stop offset="1" stop-color="#0C2539"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E7CD92"/>
      <stop offset="0.5" stop-color="#C8A45C"/>
      <stop offset="1" stop-color="#8F6F33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#C8A45C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C8A45C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- restrained guilloche / policy orbits, decorative only -->
  <g fill="none" stroke="#C8A45C" stroke-opacity="0.20">
    <circle cx="1120" cy="300" r="230" stroke-width="1.4"/>
    <circle cx="1120" cy="300" r="190" stroke-width="1.1"/>
    <circle cx="1120" cy="300" r="150" stroke-width="0.9"/>
    <circle cx="1120" cy="300" r="110" stroke-width="0.7"/>
  </g>

  <!-- three independent app windows, abstract -->
  <g fill="#F4EFE4" fill-opacity="0.045" stroke="#E7CD92" stroke-opacity="0.55" stroke-width="2">
    <rect x="838" y="118" width="330" height="196" rx="14"/>
    <rect x="880" y="198" width="330" height="196" rx="14"/>
    <rect x="922" y="278" width="330" height="196" rx="14"/>
  </g>
  <g fill="none" stroke="#E7CD92" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
    <path d="M872 330 L920 300 L968 342 L1016 292 L1064 322 L1112 276 L1160 316 L1208 288"/>
  </g>

  <!-- policy core -->
  <g transform="translate(1120 300)">
    <path d="M0 -58 L50 -38 L50 12 C50 44 28 64 0 74 C-28 64 -50 44 -50 12 L-50 -38 Z"
          fill="url(#gold)" opacity="0.95"/>
    <circle cx="0" cy="4" r="16" fill="#06131F"/>
    <rect x="-6" y="4" width="12" height="26" rx="5" fill="#06131F"/>
  </g>

  <rect x="0" y="0" width="1280" height="6" fill="url(#gold)"/>
  <rect x="0" y="634" width="1280" height="6" fill="url(#gold)"/>

  <!-- wordmark -->
  <text x="70" y="94" font-family="DejaVu Serif, serif" font-size="46" font-weight="700"
        letter-spacing="8" fill="#E7CD92">AETHERWORKSPACE</text>
  <path d="M70 112 H360" stroke="#C8A45C" stroke-width="3"/>

  <!-- headline: primary message, large enough for a phone thumbnail -->
  <g font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#F4EFE4">
    <text x="70" y="252" font-size="78">AI proposes.</text>
    <text x="70" y="342" font-size="78">Policy decides.</text>
    <text x="70" y="432" font-size="78" fill="#E7CD92">Execution is enforced.</text>
  </g>

  <!-- final-state scope: product language, no fine print -->
  <g font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#93A7B8" letter-spacing="1.5">
    <text x="70" y="530" font-size="42">HYBRID AI  ·  PRIVACY GATEWAY</text>
    <text x="70" y="602" font-size="42">HETEROGENEOUS UI</text>
  </g>
</svg>
