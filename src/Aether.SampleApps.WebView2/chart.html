<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synthetic Bond Chart — WebView2</title>
  <link rel="stylesheet" href="chart.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">SYNTHETIC · LOCAL-ONLY · WEBVIEW2</p>
        <h1 id="chart-title">Synthetic Bond Chart</h1>
        <p class="meta" id="chart-meta">Waiting for an approved typed context from the .NET host…</p>
      </div>
      <div class="badge" id="renderer-badge">JS renderer ready</div>
    </header>
    <section class="chart-card" aria-live="polite">
      <svg id="chart" viewBox="0 0 960 420" preserveAspectRatio="none" role="img"
           aria-label="Synthetic bond yield chart"></svg>
      <p class="hint" id="js-status">No typed context received yet.</p>
    </section>
    <footer>
      <span>Fictitious instruments and series only.</span>
      <span id="provenance">No remote scripts, no network fetch.</span>
    </footer>
  </main>
  <script src="chart.js"></script>
</body>
</html>
